services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nutrito
      POSTGRES_PASSWORD: nutrito
      POSTGRES_DB: nutrito
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrito -d nutrito"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
